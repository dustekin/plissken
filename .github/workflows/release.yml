name: Build and attest firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      build: |
        set -euo pipefail
        git submodule update --init --recursive
        version="${GITHUB_REF_NAME#v}"
        python3 base/tools/build.py . --release "$version"
        mv "build/plissken-$version.fwsc" \
          build/onlyusefmflashertoinstallplissken.fwsc
      packages: build/onlyusefmflashertoinstallplissken.fwsc

  title-release:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Name the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if [[ "$version" == *-rc* ]]; then
            gh release edit "$TAG" --title "Plissken $version Release Candidate" --prerelease
          else
            gh release edit "$TAG" --title "Plissken $version Release"
          fi
